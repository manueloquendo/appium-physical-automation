name: CI - Mobile Automation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

defaults:
  run:
    working-directory: .

permissions:
  contents: read

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'ci@example.com' }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'Test@123' }}
      INVALID_EMAIL: ${{ secrets.INVALID_EMAIL || 'invalid@example.com' }}
      INCORRECT_PASSWORD: ${{ secrets.INCORRECT_PASSWORD || 'wrongpassword' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Run TypeScript validation
        run: npm run typecheck

      - name: Upload automation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-logs-${{ github.run_number }}
          path: |
            logs
            screenshots
          if-no-files-found: warn
          retention-days: 7

  mobile-e2e:
    name: Optional mobile smoke check
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      CI: true
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      ANDROID_DEVICE_UDID: ${{ secrets.ANDROID_DEVICE_UDID || '' }}
      IOS_DEVICE_UDID: ${{ secrets.IOS_DEVICE_UDID || '' }}
      ANDROID_APP_PATH: ${{ secrets.ANDROID_APP_PATH || '' }}
      IOS_APP_PATH: ${{ secrets.IOS_APP_PATH || '' }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'ci@example.com' }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'Test@123' }}
      INVALID_EMAIL: ${{ secrets.INVALID_EMAIL || 'invalid@example.com' }}
      INCORRECT_PASSWORD: ${{ secrets.INCORRECT_PASSWORD || 'wrongpassword' }}

    steps:
      - name: Gate BrowserStack execution
        id: gate
        shell: bash
        run: |
          if [[ -z "${BROWSERSTACK_USERNAME}" || -z "${BROWSERSTACK_ACCESS_KEY}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "BrowserStack secrets are not configured. Skipping mobile-e2e job steps."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "BrowserStack secrets detected."
          fi

      - name: Checkout repository
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Configure Node.js
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Run Android tests sequentially
        if: steps.gate.outputs.enabled == 'true'
        run: npm run test:android:all