name: Appium Tests with Video (Self-Hosted)

on:
  workflow_dispatch:
    inputs:
      spec_file:
        description: "Optional feature path; leave empty to run all 11 tests sequentially"
        required: false
        default: ""
      force_failure_for_clickup_test:
        # TEMP TEST SWITCH (1/3): set to true only to validate ClickUp bug creation.
        description: "Force an intentional failure to test ClickUp bug creation (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  test-android-usb:
    name: Android USB Tests with Video Recording
    runs-on: [self-hosted, windows]
    environment: Mobile
    timeout-minutes: 60

    env:
      ANDROID_DEVICE_UDID: ${{ secrets.ANDROID_DEVICE_UDID }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      INVALID_EMAIL: ${{ secrets.INVALID_EMAIL }}
      INCORRECT_PASSWORD: ${{ secrets.INCORRECT_PASSWORD }}
      CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
      CLICKUP_LIST_ID: ${{ secrets.CLICKUP_LIST_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Install Appium globally
        run: npm install -g appium

      - name: Create local .env for test execution
        shell: powershell
        run: |
          $required = @{
            'TEST_USER_EMAIL' = $env:TEST_USER_EMAIL
            'TEST_USER_PASSWORD' = $env:TEST_USER_PASSWORD
            'INVALID_EMAIL' = $env:INVALID_EMAIL
            'INCORRECT_PASSWORD' = $env:INCORRECT_PASSWORD
          }

          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object { $_.Key })
          if ($missing.Count -gt 0) {
            Write-Error ("Missing required GitHub secrets for self-hosted execution: " + ($missing -join ', '))
            exit 1
          }

          @(
            "ANDROID_DEVICE_UDID=$($env:ANDROID_DEVICE_UDID)"
            "TEST_USER_EMAIL=$($env:TEST_USER_EMAIL)"
            "TEST_USER_PASSWORD=$($env:TEST_USER_PASSWORD)"
            "INVALID_EMAIL=$($env:INVALID_EMAIL)"
            "INCORRECT_PASSWORD=$($env:INCORRECT_PASSWORD)"
          ) | Set-Content -Path '.env'

          Write-Host 'Local .env file created for workflow execution.'

      - name: Validate local tools
        shell: powershell
        run: |
          $missing = @()

          if (-not (Get-Command adb -ErrorAction SilentlyContinue)) {
            $missing += 'adb'
          }

          if (-not (Get-Command appium -ErrorAction SilentlyContinue)) {
            $missing += 'appium'
          }

          if (-not (Get-Command scrcpy -ErrorAction SilentlyContinue)) {
            $missing += 'scrcpy'
          }

          if ($missing.Count -gt 0) {
            Write-Error ("Missing required tools on self-hosted runner: " + ($missing -join ', '))
            exit 1
          }

      - name: Validate USB Android device
        shell: powershell
        run: |
          $adbOutput = adb devices
          $adbLines = @($adbOutput | ForEach-Object { $_.ToString().TrimEnd() })
          $deviceLines = @($adbLines | Where-Object { $_ -match '\sdevice$' -and $_ -notmatch '^List of devices attached' })

          Write-Host ($adbLines -join [Environment]::NewLine)

          if ($deviceLines.Count -eq 0) {
            Write-Error "No Android device detected in adb devices output."
            exit 1
          }

          $detectedDeviceIds = @($deviceLines | ForEach-Object { ($_ -split '\s+')[0] })
          Write-Host ("Detected Android device IDs: " + ($detectedDeviceIds -join ', '))

          if ($env:ANDROID_DEVICE_UDID -and ($detectedDeviceIds -notcontains $env:ANDROID_DEVICE_UDID)) {
            Write-Error "Configured ANDROID_DEVICE_UDID was not detected by adb."
            exit 1
          }

      - name: Start Appium for full Android suite
        if: ${{ github.event.inputs.spec_file == '' }}
        shell: powershell
        run: |
          $appiumLogDirectory = Join-Path $PWD "logs"
          New-Item -ItemType Directory -Path $appiumLogDirectory -Force | Out-Null
          $appiumStdOutLog = Join-Path $appiumLogDirectory "appium-suite.stdout.log"
          $appiumStdErrLog = Join-Path $appiumLogDirectory "appium-suite.stderr.log"

          $appiumProcess = Start-Process -FilePath "cmd.exe" -ArgumentList @("/c", "appium --port 4723 --relaxed-security") -PassThru -WindowStyle Hidden -RedirectStandardOutput $appiumStdOutLog -RedirectStandardError $appiumStdErrLog
          "APPIUM_PID=$($appiumProcess.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APPIUM_STDOUT_LOG=$appiumStdOutLog" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APPIUM_STDERR_LOG=$appiumStdErrLog" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $maxAttempts = 90
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:4723/status" -UseBasicParsing -ErrorAction Stop
              if ($response.StatusCode -eq 200) {
                Write-Host "Appium server is ready."
                exit 0
              }
            } catch {
              if ($appiumProcess.HasExited) {
                Write-Error "Appium exited before becoming ready with code $($appiumProcess.ExitCode)."
                break
              }
            }

            Write-Host "Waiting for Appium... (attempt $attempt/$maxAttempts)"
            Start-Sleep -Seconds 2
          }

          if (Test-Path $appiumStdOutLog) {
            Get-Content -Path $appiumStdOutLog -Tail 80
          }
          if (Test-Path $appiumStdErrLog) {
            Get-Content -Path $appiumStdErrLog -Tail 80
          }
          Write-Error "Appium did not become ready within 180 seconds."
          exit 1

      - name: Run Android tests in series
        shell: powershell
        run: |
          $spec = "${{ github.event.inputs.spec_file }}"

          if ([string]::IsNullOrWhiteSpace($spec)) {
            Write-Host "No spec provided. Running the full Android suite in sequence for a single Allure report."
            npm run report:clean
            npm run test:android:all
            exit $LASTEXITCODE
          }

          Write-Host "Running single spec with video recording: $spec"
          & .\run-test-with-video.ps1 -SpecFile $spec -VideoDir "./videos" -AppiumStartupTimeoutSeconds 180
          exit $LASTEXITCODE

      - name: Stop Appium after full Android suite
        if: ${{ always() && github.event.inputs.spec_file == '' }}
        shell: powershell
        run: |
          if ($env:APPIUM_PID) {
            $appiumProcess = Get-Process -Id ([int]$env:APPIUM_PID) -ErrorAction SilentlyContinue
            if ($appiumProcess) {
              Stop-Process -Id $appiumProcess.Id -Force
              Write-Host "Appium stopped."
            }
          }

      - name: Force failure for ClickUp test
        # TEMP TEST STEP (2/3): this intentionally fails the job only when input=true.
        if: ${{ github.event.inputs.force_failure_for_clickup_test == 'true' }}
        shell: powershell
        run: |
          # REVERT NOTE (3/3): set input back to false (or remove this step) after validating ClickUp.
          Write-Error "Intentional failure enabled to test ClickUp bug creation."
          exit 1

      - name: Generate Allure report if results exist
        if: always()
        shell: powershell
        run: |
          $resultDirs = @(
            "reports/allure-results",
            "allure-results"
          )

          $resultDir = $resultDirs | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($resultDir) {
            Write-Host "Found Allure results at: $resultDir"
            if ($resultDir -eq "allure-results") {
              allure generate $resultDir --clean -o reports/allure-report
            } else {
              npm run report:generate
            }
          } else {
            Write-Host "No Allure results found; skipping report generation."
          }

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos-${{ github.run_number }}
          path: videos/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_number }}
          path: reports/allure-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: reports/allure-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-and-screenshots-${{ github.run_number }}
          path: |
            screenshots/
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Create ClickUp bug when workflow fails
        if: failure()
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLICKUP_API_TOKEN) -or [string]::IsNullOrWhiteSpace($env:CLICKUP_LIST_ID)) {
            Write-Host "ClickUp integration skipped: CLICKUP_API_TOKEN or CLICKUP_LIST_ID not configured."
            exit 0
          }

          $specInput = "${{ github.event.inputs.spec_file }}"
          if ([string]::IsNullOrWhiteSpace($specInput)) {
            $specInput = "./test/features/authentication/blank-fields-validation.feature"
          }

          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $repoUrl = "${{ github.server_url }}/${{ github.repository }}"
          $title = "[Automation][Android USB] Failed run #${{ github.run_number }}"

          $description = @"
          Automated bug generated from GitHub Actions.

          Workflow: ${{ github.workflow }}
          Job: ${{ github.job }}
          Repository: ${{ github.repository }}
          Branch/Ref: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Triggered by: ${{ github.actor }}
          Spec file: $specInput

          Run URL: $runUrl
          Repository URL: $repoUrl

          Artifacts expected:
          - test-videos-${{ github.run_number }}
          - allure-results-${{ github.run_number }}
          - allure-report-${{ github.run_number }}
          - logs-and-screenshots-${{ github.run_number }}
          "@

          $payload = @{
            name = $title
            description = $description
            tags = @("automation", "bug", "android", "github-actions")
          }

          $headers = @{
            Authorization = $env:CLICKUP_API_TOKEN
            "Content-Type" = "application/json"
          }

          $jsonBody = $payload | ConvertTo-Json -Depth 10
          $endpoint = "https://api.clickup.com/api/v2/list/$($env:CLICKUP_LIST_ID)/task"

          try {
            $result = Invoke-RestMethod -Method Post -Uri $endpoint -Headers $headers -Body $jsonBody
            Write-Host "ClickUp bug created successfully. Task ID: $($result.id)"
            Write-Host "Task URL: $($result.url)"
          } catch {
            Write-Warning "Failed to create ClickUp bug: $($_.Exception.Message)"
            if ($_.ErrorDetails -and $_.ErrorDetails.Message) {
              Write-Warning "ClickUp API details: $($_.ErrorDetails.Message)"
            }
            # Do not fail the workflow due to ticketing issues.
            exit 0
          }
